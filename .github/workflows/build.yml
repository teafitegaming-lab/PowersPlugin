name: Build PowersPlugin

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build with Maven
        run: mvn clean package -DskipTests

      - name: Show target files
        run: ls -lh target/

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: PowersPlugin-JAR
          path: target/PowersPlugin-1.0.0.jar
