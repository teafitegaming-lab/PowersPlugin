name: PowersPlugin
version: '${project.version}'
main: com.powersplugin.PowersPlugin
api-version: '1.20'
authors: [Custom]
description: Custom Powers, Weapons, Armor, Boss and Crown Plugin

commands:
  powers:
    description: Powers plugin main command
    usage: /powers <give|info|list>
    aliases: [pw]
  givecustomweapon:
    description: Give a custom weapon to a player
    usage: /givecustomweapon <player> <weapon_name>
    aliases: [gcw]
  givecustomarmor:
    description: Give god armor to a player
    usage: /givecustomarmor <player>
    aliases: [gca]
  spawnboss:
    description: Spawn the custom boss
    usage: /spawnboss
    aliases: [sb]
  resetcooldown:
    description: Reset a player's Celestial Judgment sword cooldown
    usage: /resetcooldown <player>
    aliases: [resetcd]
  toggleparticles:
    description: Toggle your own power particle effects on/off
    usage: /toggleparticles
    aliases: [tp, particles]
  resetarmorcooldown:
    description: Reset a player's God Armor Sonic Boom cooldown (admin only)
    usage: /resetarmorcooldown <player>
    aliases: [racd]

permissions:
  powersplugin.admin:
    description: Admin access to all plugin commands
    default: op
  powersplugin.use:
    description: Use custom powers
    default: true
