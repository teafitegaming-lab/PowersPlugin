name: PowersPlugin
version: '${project.version}'
main: com.powersplugin.PowersPlugin
api-version: '1.20'
authors: [Custom]
description: Custom Powers, Weapons, Armor, Boss and Crown Plugin

commands:
  powers:
    description: Powers plugin main command
    usage: /powers <give|info|list>
    aliases: [pw]
  givecustomweapon:
    description: Give a custom weapon to a player
    usage: /givecustomweapon <player> <weapon_name>
    aliases: [gcw]
  givecustomarmor:
    description: Give god armor to a player
    usage: /givecustomarmor <player>
    aliases: [gca]
  spawnboss:
    description: Spawn the custom boss
    usage: /spawnboss
    aliases: [sb]
  givecrown:
    description: Give the crown (admin only)
    usage: /givecrown <player>

permissions:
  powersplugin.admin:
    description: Admin access to all plugin commands
    default: op
  powersplugin.use:
    description: Use custom powers
    default: true
